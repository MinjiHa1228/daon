# =========================================================
# 배포(Render + Supabase)용 설정
# Render 환경변수에 SPRING_PROFILES_ACTIVE=prod 를 넣으면 이 파일이 적용됨
# 비밀번호는 여기 적지 않고 Render 환경변수 DB_PASSWORD 에만 넣는다
# =========================================================

server.port=${PORT:8080}

# Supabase (Session pooler)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.ztnlsuhdknpzhikukcvo}
spring.datasource.password=${DB_PASSWORD}

# 무료 플랜 연결 수 제한 때문에 작게 유지
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# 화면에 시간이 한국 시간으로 나오도록
spring.jackson.time-zone=Asia/Seoul

# 배포 환경에서는 자동 재시작 기능 끔
spring.devtools.restart.enabled=false
