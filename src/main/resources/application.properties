spring.application.name=daon

server.port=8080

# JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# MyBatis
mybatis.mapper-locations=classpath:/mappers/*.xml
mybatis.type-aliases-package=com.example.daon.vo
mybatis.configuration.map-underscore-to-camel-case=true

# DB
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/daon?serverTimezone=Asia/Seoul
spring.datasource.username=daon
spring.datasource.password=daon

# 로그인 상태를 DB에 보관하여 Eclipse/서버 재시작 후에도 유지
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=12h
server.servlet.session.timeout=12h
server.servlet.session.cookie.max-age=43200
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# 이력서 첨부파일 크기 제한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
