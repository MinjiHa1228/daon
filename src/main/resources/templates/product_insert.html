<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상품 등록 - 다온테크 ERP</title>
<style>:root{--navy:#17324d;--blue:#2675a8;--line:#d7e0e6}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef4f7,#f8fafb);color:#25313c;font-family:"Malgun Gothic",sans-serif}.nav{height:62px;background:var(--navy);display:flex;align-items:center;gap:26px;padding:0 28px;color:#fff}.brand{font-size:22px;font-weight:800;margin-right:20px}.nav a{color:#dceaf2;text-decoration:none;font-weight:700}.wrap{max-width:850px;margin:36px auto;padding:0 20px}.title{text-align:center;margin-bottom:24px}.title h1{font-size:30px;margin:0 0 8px}.title p{color:#6b7b86}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px #17324d17;overflow:hidden}.panel-head{background:#edf5f9;border-bottom:1px solid var(--line);padding:20px 28px}.panel-head strong{font-size:18px}.form{padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:22px}.field label{display:block;font-weight:800;margin-bottom:8px}.required{color:#d64747}.field input,.field select{width:100%;height:46px;padding:0 13px;border:1px solid #b9c7d0;border-radius:7px;background:#fff;font:inherit;outline:none}.field input:focus,.field select:focus{border-color:#2675a8;box-shadow:0 0 0 3px #2675a81a}.full{grid-column:1/-1}.hint{font-size:12px;color:#73828d;margin-top:6px}.footer{grid-column:1/-1;border-top:1px solid var(--line);padding-top:22px;display:flex;justify-content:flex-end;gap:10px}.btn{padding:12px 22px;border-radius:7px;border:0;font-weight:800;font-size:15px;text-decoration:none;cursor:pointer}.cancel{background:#fff;border:1px solid #bdc9d1;color:#46545e}.save{background:var(--blue);color:#fff}.preview{grid-column:1/-1;background:#f8fafb;border:1px dashed #bdcbd4;border-radius:8px;padding:13px;color:#5d6c76}@media(max-width:650px){.form{grid-template-columns:1fr;padding:20px}.full,.footer,.preview{grid-column:auto}.nav{padding:0 10px;gap:12px}}</style>
<style>.product-manage-wrap{max-width:1450px}.product-manage-wrap>.title,.product-manage-wrap>.panel:first-of-type{max-width:850px;margin-left:auto;margin-right:auto}.product-list-panel{margin-top:22px}.product-list-panel .panel-head{display:flex;justify-content:space-between}.product-table-wrap{overflow:hidden}.product-manage-table{width:100%;border-collapse:collapse}.product-manage-table th{padding:11px;background:#edf3f6;text-align:left;color:#526572}.product-manage-table td{padding:11px;border-top:1px solid #d8e1e8}.product-actions{display:flex;gap:7px;white-space:nowrap}.product-actions form{margin:0}.product-action{height:34px;display:inline-flex;align-items:center;justify-content:center;padding:0 11px;border-radius:8px;border:1px solid transparent;font-size:13px;font-weight:800;text-decoration:none;cursor:pointer}.product-action.edit{color:#176b94;background:#e8f3f9;border-color:#b8d9e9}.product-action.delete{color:#b53333;background:#fff0f0;border-color:#f0c5c5}@media(max-width:760px){.product-list-panel{padding:0!important}.product-table-wrap{overflow-x:auto}.product-manage-table{min-width:850px}}</style>
<link rel="stylesheet" href="/mobile.css">
<script defer src="/common-nav.js"></script></head>
<body>
<nav class="nav" th:attr="data-admin=${session.loginUser.role=='ADMIN'}">
<div class="brand">다온테크 ERP</div>
<a href="/product/list">재고현황</a>
<a href="/stock/movement">입출고 처리</a>
<a href="/stock/history">입출고 이력</a>
<a href="/customer/list">거래처 관리</a>
<form action="/logout" method="post" style="margin-left:auto">
<button style="border:0;background:#ffffff22;color:white;padding:7px 10px;border-radius:5px;cursor:pointer" th:text="${session.loginUser.displayName}+' 로그아웃'">
</button>
</form>
</nav>
<main class="wrap product-manage-wrap">
<div class="title">
<h1 th:text="${editProduct==null?'새 상품 등록':'상품 정보 수정'}">새 상품 등록</h1>
<p>상품 기본정보를 등록하면 재고가 0개로 자동 생성됩니다.</p>
</div>
<section class="panel">
<div class="panel-head">
<strong>상품 기본정보</strong>
</div>
<form class="form" th:action="${editProduct==null?'/product/insert':'/product/update'}" method="post">
<div class="field">
<label>상품코드 <span class="required">*</span>
</label>
<input id="code" name="productCode" placeholder="예: CB-PNK" maxlength="20" required th:value="${editProduct?.productCode}" th:readonly="${editProduct!=null}">
<div class="hint">영문 대문자와 하이픈 사용을 권장합니다.</div>
</div>
<div class="field">
<label>상품명 <span class="required">*</span>
</label>
<input id="name" name="productName" placeholder="예: 도마" maxlength="50" required th:value="${editProduct?.productName}">
</div>
<div class="field">
<label>상품 구분 <span class="required">*</span>
</label>
<select id="type" name="type">
<option value="SINGLE" th:selected="${editProduct==null||editProduct.type=='SINGLE'}">단품</option>
<option value="SET" th:selected="${editProduct?.type=='SET'}">세트</option>
</select>
</div>
<div class="field">
<label>카테고리 <span class="required">*</span>
</label>
<select name="category">
<option value="도마" th:selected="${editProduct?.category=='도마'}">도마</option>
<option value="거치대" th:selected="${editProduct?.category=='거치대'}">거치대</option>
<option value="세트" th:selected="${editProduct?.category=='세트'}">세트</option>
<option value="기타" th:selected="${editProduct?.category=='기타'}">기타</option>
</select>
</div>
<div class="field">
<label>색상</label>
<input id="color" name="color" placeholder="예: 핑크" th:value="${editProduct?.color}">
<div class="hint">세트 상품은 비워도 됩니다.</div>
</div>
<div class="field">
<label>단가</label>
<input name="price" type="number" th:value="${editProduct==null?0:editProduct.price}" min="0" step="1">
</div>
<input type="hidden" name="useYn" value="Y">
<div class="preview">등록 후 재고현황 표에 상품이 추가되며, 첫 입고는 <b>입출고 처리</b> 메뉴에서 입력할 수 있습니다.</div>
<div class="footer">
<a class="btn cancel" href="/product/list">취소</a>
<button class="btn save" type="submit" th:text="${editProduct==null?'상품 저장':'수정 내용 저장'}">상품 저장</button>
</div>
</form>
</section>
<section class="panel product-list-panel">
<div class="panel-head"><strong>등록 상품 관리</strong><span th:text="${'총 '+#lists.size(products)+'개'}"></span></div>
<div class="product-table-wrap"><table class="product-manage-table"><thead><tr><th>상품코드</th><th>상품명</th><th>구분</th><th>카테고리</th><th>색상</th><th>단가</th><th>현재고</th><th>관리</th></tr></thead><tbody><tr th:each="p:${products}"><td th:text="${p.productCode}"></td><td><b th:text="${p.productName}"></b></td><td th:text="${p.type=='SET'?'세트':'단품'}"></td><td th:text="${p.category}"></td><td th:text="${p.color?:'-'}"></td><td th:text="${#numbers.formatInteger(p.price,0,'COMMA')+'원'}"></td><td th:text="${#numbers.formatInteger(p.quantity,0,'COMMA')+'개'}"></td><td><div class="product-actions"><a class="product-action edit" th:href="@{/product/insert(editCode=${p.productCode})}">✎ 수정</a><form action="/product/delete" method="post" onsubmit="return confirm('이 상품을 삭제할까요? 재고와 입출고 이력은 보존됩니다.');"><input type="hidden" name="productCode" th:value="${p.productCode}"><button class="product-action delete" type="submit">× 삭제</button></form></div></td></tr><tr th:if="${#lists.isEmpty(products)}"><td colspan="8">등록된 상품이 없습니다.</td></tr></tbody></table></div>
</section>
</main>
<script>const type=document.getElementById('type'),color=document.getElementById('color');type.addEventListener('change',()=>{if(type.value==='SET'){color.value='';color.disabled=true;color.placeholder='세트 상품은 색상을 사용하지 않습니다';}else{color.disabled=false;color.placeholder='예: 핑크';}});</script>
</body>
</html>
