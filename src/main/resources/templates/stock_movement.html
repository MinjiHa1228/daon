<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>입출고 처리 - 다온테크 ERP</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7f9;color:#25313c;font-family:"Malgun Gothic",sans-serif}.nav{height:62px;background:#17324d;color:white;display:flex;align-items:center;gap:26px;padding:0 28px}.brand{font-size:22px;font-weight:800;margin-right:20px}.nav a{color:#dceaf2;text-decoration:none;font-weight:700}.wrap{max-width:900px;margin:30px auto;padding:0 20px}.panel{background:white;border:1px solid #d8e1e8;border-radius:10px;padding:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-weight:700;margin-bottom:7px}select,input,textarea{width:100%;padding:12px;border:1px solid #bccbd5;border-radius:6px;font:inherit}textarea{min-height:90px}.full{grid-column:1/-1}.help{color:#687985;font-size:13px}.btn{border:0;border-radius:7px;background:#2675a8;color:white;padding:13px 22px;font-weight:800;font-size:16px;cursor:pointer}.message,.error{padding:12px;border-radius:7px;margin-bottom:16px}.message{background:#e5f5ed;color:#226a4d}.error{background:#fdeaea;color:#a92e2e}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style>
<link rel="stylesheet" href="/mobile.css">
<script defer src="/common-nav.js"></script></head>
<body>
<nav class="nav" th:attr="data-admin=${session.loginUser.role=='ADMIN'}">
<div class="brand">다온테크 ERP</div>
<a href="/product/list">재고 관리</a>
<a href="/order/list">수주·생산·출고</a>
<a href="/stock/movement">입출고 처리</a>
<a href="/stock/history">입출고 이력</a>
<a href="/customer/list">거래처 관리</a>
<form action="/logout" method="post" style="margin-left:auto">
<button style="border:0;background:#ffffff22;color:white;padding:7px 10px;border-radius:5px;cursor:pointer" th:text="${session.loginUser.displayName}+' 로그아웃'">
</button>
</form>
</nav>
<main class="wrap">
<h1>입출고 처리</h1>
<p>모든 처리는 현재고에 즉시 반영되고 이력으로 보관됩니다.</p>
<div th:if="${message}" class="message" th:text="${message}">
</div>
<div th:if="${error}" class="error" th:text="${error}">
</div>
<section class="panel">
<form action="/stock/movement" method="post" class="grid">
<div class="full">
<label>상품</label>
<select name="productCode" required>
<option value="">상품을 선택하세요</option>
<option th:each="p:${products}" th:value="${p.productCode}" th:selected="${p.productCode==selectedProductCode}" th:text="${p.productCode+' | '+p.productName+' '+(p.color!=null?p.color:'')+' (현재 '+p.quantity+'개)'}">
</option>
</select>
</div>
<div>
<label>처리 날짜</label>
<input name="movementDate" type="date" th:value="${today}" th:max="${today}" required>
<p class="help">오늘 또는 과거 날짜를 선택할 수 있습니다.</p>
</div>
<div>
<label>처리 구분</label>
<select name="historyType" required>
<option value="IN" th:selected="${selectedMode=='IN'}">입고 (+)</option>
<option value="OUT" th:selected="${selectedMode=='OUT'}">출고 (-)</option>
<option value="BAD" th:selected="${selectedMode=='BAD'}">불량 (-)</option>
<option value="COMP" th:selected="${selectedMode=='COMP'}">보상분 (+)</option>
<option value="MOVE" th:selected="${selectedMode=='MOVE'}">재고이동/반출 (-)</option>
<option value="LACK" th:selected="${selectedMode=='LACK'}">수량부족 (-)</option>
</select>
</div>
<div>
<label>수량</label>
<input name="quantity" type="number" min="1" required autofocus>
</div>
<div class="full">
<label>거래처 (선택)</label>
<select name="customerId">
<option value="">거래처 없음</option>
<option th:each="c:${customers}" th:value="${c.customerId}" th:text="${c.customerName}">
</option>
</select>
</div>
<div class="full">
<label>메모</label>
<textarea name="memo" placeholder="발주번호, 담당자, 처리 사유 등을 입력하세요">
</textarea>
<p class="help">출고·불량 등 차감 처리 시 현재고보다 많은 수량은 등록되지 않습니다.</p>
</div>
<div class="full">
<button class="btn" type="submit">재고 처리 저장</button>
</div>
</form>
</section>
</main>
</body>
</html>
