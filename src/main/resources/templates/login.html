<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 - 다온테크 ERP</title>
<style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#17324d,#285d79);font-family:"Malgun Gothic";color:#25313c;min-height:100vh;display:grid;place-items:center}.box{width:min(420px,calc(100% - 30px));background:#fff;padding:34px;border-radius:14px;box-shadow:0 15px 40px #0005}.logo{font-size:25px;font-weight:900;color:#17324d}label{display:block;font-weight:700;margin:17px 0 6px}input{width:100%;padding:13px;border:1px solid #b9c7d0;border-radius:7px;font:inherit}button{width:100%;margin-top:22px;padding:14px;background:#2675a8;color:#fff;border:0;border-radius:7px;font-weight:800}.error,.msg{padding:10px;border-radius:6px;margin-top:12px}.error{background:#fdeaea;color:#a52d2d}.msg{background:#e5f5ed;color:#236c4f}</style>
<link rel="stylesheet" href="/mobile.css">
</head>
<body>
<main class="box">
<div class="logo">다온테크 ERP</div>
<h1>로그인</h1>
<div th:if="${error}" class="error" th:text="${error}">
</div>
<div th:if="${message}" class="msg" th:text="${message}">
</div>
<form method="post" action="/login">
<label>아이디</label>
<input name="username" autocomplete="username" required autofocus>
<label>비밀번호</label>
<input name="password" type="password" autocomplete="current-password" required>
<button>로그인</button>
</form>
</main>
</body>
</html>
